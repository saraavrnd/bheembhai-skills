version: 1
skill: sdlc-discovery-risk-register
summary: >
  risk-register.md lists sourced risks with likelihood and impact, carries every high or critical security finding forward, and grounds TODO/FIXME debt claims in real markers.
verdicts_used: [failed_execution, changes_requested]

facts:
  # >>> GENERATED facts (tools/gen_template_checks.py)
  tmpl_has_risks_likelihood:
    kind: yaml_block
    from: note
    info: "yaml machine"
    expr: "$.risks[*].likelihood"
  tmpl_has_risks_severity:
    kind: yaml_block
    from: note
    info: "yaml machine"
    expr: "$.risks[*].severity"
  # <<< GENERATED
  service_ids:
    kind: yaml_block
    from: "{layout.services_manifest}"
    info: "yaml bheembhai:foreach"
    expr: "$.services[*].id"
  have_test_coverage_map:
    kind: glob
    pattern: "{layout.discovery_root}*/test-coverage-map.md"
    key: parent_dir
  have_dependency_inventory:
    kind: glob
    pattern: "{layout.discovery_root}*/dependency-inventory.md"
    key: parent_dir
  observed_sample:
    kind: yaml_block
    from: note
    info: "yaml machine"
    expr: "$..[?(@.confidence == 'observed')]"
  high_security_findings:
    kind: yaml_block
    from: "{layout.discovery_system_dir}security-posture.md"
    info: "yaml machine"
    expr: "$.findings[?(@.severity == 'high')]"
  risk_ids:
    kind: yaml_block
    from: note
    info: "yaml machine"
    expr: "$.risks[*].id"
  risk_entries:
    kind: yaml_block
    from: note
    info: "yaml machine"
    expr: "$.risks[*]"

preconditions:
  - id: services_manifest_present
    run: builtin:file_exists
    args: {path: "{layout.services_manifest}"}
    on_fail: failed_execution
    reason_code: missing_input
  - id: every_service_has_test_coverage_map
    run: builtin:set_relation
    args: {left: facts.service_ids, right: facts.have_test_coverage_map, relation: subset}
    on_fail: failed_execution
    reason_code: missing_input
  - id: every_service_has_dependency_inventory
    run: builtin:set_relation
    args: {left: facts.service_ids, right: facts.have_dependency_inventory, relation: subset}
    on_fail: failed_execution
    reason_code: missing_input
  - id: security_posture_present
    run: builtin:file_exists
    args: {path: "{layout.discovery_system_dir}security-posture.md"}
    on_fail: failed_execution
    reason_code: missing_input
  - id: conventions_present
    run: builtin:file_exists
    args: {path: "{layout.discovery_system_dir}conventions.md"}
    on_fail: failed_execution
    reason_code: missing_input

artifacts:
  - id: note
    path: "{layout.discovery_system_dir}risk-register.md"

checks:
  - id: own_file_only
    run: builtin:diff_paths
    args: {allowed: ["{layout.discovery_system_dir}risk-register.md"]}
    on_fail: changes_requested
    reason_code: scope
  # >>> GENERATED from templates/risk-register.md.tmpl by tools/gen_template_checks.py: do not edit by hand
  - id: tmpl_block
    description: "The machine block parses and has every top-level key the template declares."
    run: builtin:yaml_block
    args: {artifact: note, info: "yaml machine", required_keys: ["artifact", "risks"], artifact_name: "risk-register"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_sections
    run: builtin:md_sections
    args:
      artifact: note
      ordered: true
      required: ["1. Overview", "2. Risk Summary", "3. Detailed Register", "4. Evidence Notes"]
    on_fail: changes_requested
    reason_code: structure
  - id: tmpl_risks_id
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.risks[?(!@.id)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_risks_risk
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.risks[?(!@.risk)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_risks_impact
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.risks[?(!@.impact)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_risks_likelihood
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.risks[?(!@.likelihood)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_risks_severity
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.risks[?(!@.severity)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_risks_recommendation
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.risks[?(!@.recommendation)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_risks_likelihood_enum
    when: "facts.tmpl_has_risks_likelihood"
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.risks[*].likelihood", op: "in", value: ["high", "med", "low"]}
    on_fail: changes_requested
    reason_code: structure
  - id: tmpl_risks_severity_enum
    when: "facts.tmpl_has_risks_severity"
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.risks[*].severity", op: "in", value: ["high", "med", "low"]}
    on_fail: changes_requested
    reason_code: structure
  - id: tmpl_evidence
    description: "Contract: every entry has confidence; observed needs source, inferred needs basis or note."
    run: builtin:evidence_entries
    args: {artifact: note, info: "yaml machine", lists: ["risks"]}
    on_fail: changes_requested
    reason_code: unsupported_claim
  # <<< GENERATED
  - id: prose_tagged
    description: Every factual line in the prose carries an observed/inferred/uncertain tag.
    run: builtin:inline_evidence_tags
    args: {artifact: note, exempt_sections: ["1. Overview", "Evidence Notes"]}
    on_fail: changes_requested
    reason_code: unsupported_claim
  - id: confidence_summary_true
    run: builtin:confidence_summary_matches
    args: {artifact: note, info: "yaml machine"}
    on_fail: changes_requested
    reason_code: unsupported_claim
  - id: sources_resolve
    run: builtin:sources_resolve
    args: {artifact: note, info: "yaml machine", sample: 40, follow_artifacts: true, quote: true}
    on_fail: changes_requested
    reason_code: unsupported_claim
  - id: no_template_residue
    run: builtin:md_no_placeholders
    args: {artifact: note}
    on_fail: changes_requested
    reason_code: placeholder_left
  - id: risk_ids_unique
    run: builtin:unique_values
    args: {fact: facts.risk_ids}
    on_fail: changes_requested
    reason_code: duplicate

judge:
  tier: medium
  vendor: prefer_different
  inputs: [note, facts.observed_sample, facts.high_security_findings]
  criteria:
    - id: cited_evidence_supports_claim
      for_each: facts.observed_sample
      max_items: 15
      question: "Does the cited per-service artifact entry or code line support this claim exactly as stated? Claim and source: {item}"
      on_fail: changes_requested
      reason_code: unsupported_claim
    - id: synthesis_labelled
      question: "Is every judgment or synthesis claim (not directly visible in one source) tagged inferred with its basis stated?"
      on_fail: changes_requested
      reason_code: unsupported_claim
    - id: security_carried_forward
      for_each: facts.high_security_findings
      max_items: 10
      question: "Does the register carry this high-severity security finding as a risk (same issue, citing it)? Finding: {item}"
      on_fail: changes_requested
      reason_code: coverage_gap
    - id: risks_actionable
      question: "Does each risk say what could go wrong and what evidence shows it, rather than a generic category (for example 'tech debt')?"
      on_fail: changes_requested
      reason_code: quality
