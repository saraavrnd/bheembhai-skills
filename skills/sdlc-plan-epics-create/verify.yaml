version: 1
skill: sdlc-plan-epics-create
summary: Every PRD requirement lands in exactly one epic, epic-map.json matches its schema, epics.md carries the one bheembhai:foreach block the per-epic fan-out reads, only the epic plan files change, and nothing is written to Jira (tracker-sync publishes, ADR-035).
verdicts_used: [failed_execution, changes_requested]

facts:
  prd_req_ids:
    kind: regex
    from: "{layout.prd}"
    pattern: '(?m)^\|\s*(N?FR-\d{3})\s*\|'
  map_req_ids:
    kind: jsonpath
    from: epic_map
    expr: "$.epics[*].requirement_ids[*]"
  map_epic_keys:
    kind: jsonpath
    from: epic_map
    expr: "$.epics[*].epic_key"
  epics_block_ids:
    kind: yaml_block
    from: epics_md
    info: "yaml bheembhai:foreach"
    expr: "$.epics[*].id"
  epics_md_req_ids:
    kind: regex
    from: epics_md
    pattern: '\b(N?FR-\d{3})\b'

preconditions:
  - id: prd_present
    run: builtin:file_exists
    args: {path: "{layout.prd}"}
    on_fail: failed_execution
    reason_code: missing_input
  - id: prd_has_ids
    run: builtin:regex_count
    args: {path: "{layout.prd}", pattern: '(?m)^\|\s*N?FR-\d{3}\s*\|', min: 1}
    on_fail: failed_execution
    reason_code: missing_input

artifacts:
  - id: epics_md
    path: "{layout.epics}"
  - id: epic_map
    path: "{layout.epic_map}"

checks:
  - id: epic_map_schema
    run: builtin:json_schema
    args: {artifact: epic_map, schema: templates/epic-map.schema.json}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: every_req_in_exactly_one_epic
    run: builtin:set_relation
    args: {left: facts.prd_req_ids, right: facts.map_req_ids, relation: equal, exactly_once: true}
    on_fail: changes_requested
    reason_code: coverage_gap
  - id: epics_md_matches_map
    description: The reviewable plan and the machine map list the same requirement IDs.
    run: builtin:set_relation
    args: {left: facts.map_req_ids, right: facts.epics_md_req_ids, relation: subset}
    on_fail: changes_requested
    reason_code: traceability_gap
  - id: epic_keys_unique
    run: builtin:unique_values
    args: {fact: facts.map_epic_keys}
    on_fail: changes_requested
    reason_code: duplicate
  - id: foreach_block
    description: >
      epics.md opens with the one machine block the planning fan-out reads (ADR-027); a
      missing or unparseable block fails the parent run at the fan-out node, after the gate.
    run: builtin:yaml_block
    args: {artifact: epics_md, info: "yaml bheembhai:foreach", required_keys: [epics]}
    on_fail: changes_requested
    reason_code: structure
  - id: block_ids_present
    description: Every block entry names its id — the child run's ITEM.id and the fan-out's uniqueness key.
    run: builtin:jsonpath_assert
    args: {artifact: epics_md, info: "yaml bheembhai:foreach", expr: "$.epics[?(!@.id)]", op: empty}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: block_keys_present
    description: Every block entry names its epic_key — the child run's {epic} (its docs/product/epics/<EPIC_KEY>/ folder).
    run: builtin:jsonpath_assert
    args: {artifact: epics_md, info: "yaml bheembhai:foreach", expr: "$.epics[?(!@.epic_key)]", op: empty}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: block_summaries_present
    description: Every block entry names its summary — ITEM.summary for the child run.
    run: builtin:jsonpath_assert
    args: {artifact: epics_md, info: "yaml bheembhai:foreach", expr: "$.epics[?(!@.summary)]", op: empty}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: block_ids_unique
    run: builtin:unique_values
    args: {fact: facts.epics_block_ids}
    on_fail: changes_requested
    reason_code: duplicate
  - id: block_matches_map
    description: The fan-out block and the traceability map name the same epic keys.
    run: builtin:set_relation
    args: {left: facts.map_epic_keys, right: facts.epics_block_ids, relation: equal, exactly_once: true}
    on_fail: changes_requested
    reason_code: traceability_gap
  - id: epic_sections
    run: builtin:md_sections
    args:
      artifact: epics_md
      required: ["Description", "Functional scope", "Implementation guidance", "Goal", "Covered requirements"]
      match: contains
    on_fail: changes_requested
    reason_code: structure
  - id: no_template_residue
    run: builtin:md_no_placeholders
    args: {artifact: epics_md}
    on_fail: changes_requested
    reason_code: placeholder_left
  - id: no_tracker_writes
    description: Authoring only — Jira writes belong to sdlc-tracker-sync (ADR-035).
    run: builtin:trace_tool_absent
    args: {tool: '(?i)(create|edit|update|transition|delete).*(issue|jira)|createJiraIssue|editJiraIssue|transitionJiraIssue'}
    on_fail: changes_requested
    reason_code: policy
  - id: plan_files_only
    run: builtin:diff_paths
    args: {allowed: ["{layout.epics}", "{layout.epic_map}"]}
    on_fail: changes_requested
    reason_code: scope

judge:
  tier: medium
  vendor: prefer_different
  inputs: [epics_md, epic_map]
  criteria:
    - id: self_contained
      question: "Could a Jira reader who sees only one epic's body understand the feature, the users, the implementation shape and the build order, without reading the PRD?"
      on_fail: changes_requested
      reason_code: quality
    - id: sensible_boundaries
      question: "Is each epic one coherent theme of roughly a few sprints, with no epic bundling two clearly separable themes or more than about 15 requirements?"
      on_fail: changes_requested
      reason_code: quality
    - id: dependencies_explicit
      question: "Where an epic depends on an actor, entity or state another epic creates, is that dependency written in the epic body?"
      on_fail: changes_requested
      reason_code: missing_requirement
