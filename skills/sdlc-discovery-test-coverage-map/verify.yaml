version: 1
skill: sdlc-discovery-test-coverage-map
summary: >
  test-coverage-map.md lists test layers and files that exist, maps them to source areas, and names bare areas, each sourced.
verdicts_used: [failed_execution, changes_requested]

facts:
  # >>> GENERATED facts (tools/gen_template_checks.py)
  tmpl_has_tests_layer:
    kind: yaml_block
    from: note
    expr: "$.tests[*].layer"
  tmpl_has_area_coverage_tested:
    kind: yaml_block
    from: note
    expr: "$.area_coverage[*].tested"
  tmpl_has_layers_needs_services:
    kind: yaml_block
    from: note
    expr: "$.layers.*.needs_services"
  tmpl_has_layers:
    kind: yaml_block
    from: note
    expr: "$.layers.*"
  # <<< GENERATED
  stack_pack:
    kind: yaml_block
    from: "{layout.discovery_service_dir}stack.md"
    expr: "$.stack_pack"
  note_pack:
    kind: yaml_block
    from: note
    expr: "$.stack_pack"
  inference_mode:
    kind: yaml_block
    from: "{layout.discovery_service_dir}stack.md"
    expr: "$[?(@.stack_pack == 'none')]"
  test_paths:
    kind: yaml_block
    from: note
    expr: "$.tests[*].file"
  test_entries:
    kind: yaml_block
    from: note
    expr: "$.tests[*]"
  coverage_areas:
    kind: yaml_block
    from: note
    expr: "$.area_coverage[*].area"
  area_entries:
    kind: yaml_block
    from: note
    expr: "$.area_coverage[*]"
  layer_entries:
    kind: yaml_block
    from: note
    expr: "$.layers[*]"
  observed_sample:
    kind: yaml_block
    from: note
    expr: "$.tests[?(@.confidence == 'observed')]"

preconditions:
  - id: stack_note_present
    run: builtin:file_exists
    args: {path: "{layout.discovery_service_dir}stack.md"}
    on_fail: failed_execution
    reason_code: missing_input
  - id: structure_map_present
    run: builtin:file_exists
    args: {path: "{layout.discovery_service_dir}structure-map.md"}
    on_fail: failed_execution
    reason_code: missing_input

artifacts:
  - id: note
    path: "{layout.discovery_service_dir}test-coverage-map.md"

checks:
  - id: own_service_only
    description: >
      A fan-out child writes only under its own service folder (a child that wrote all services'
      notes made every push-rebase conflict, live 2026-10-17).
    run: builtin:diff_paths
    args: {allowed: ["{layout.discovery_service_dir}**"]}
    on_fail: changes_requested
    reason_code: scope
  # >>> GENERATED from templates/test-coverage-map.md.tmpl by tools/gen_template_checks.py: do not edit by hand
  - id: tmpl_block
    description: "The machine block parses and has every top-level key the template declares."
    run: builtin:yaml_block
    args: {artifact: note, required_keys: ["artifact", "service", "generated", "stack_pack", "summary", "layers", "tests", "area_coverage"], artifact_name: "test-coverage-map"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_tests_file
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.tests[?(!@.file)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_tests_layer
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.tests[?(!@.layer)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_tests_covers
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.tests[?(!@.covers)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_tests_layer_enum
    when: "facts.tmpl_has_tests_layer"
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.tests[*].layer", op: "in", value: ["unit", "integration", "e2e"]}
    on_fail: changes_requested
    reason_code: structure
  - id: tmpl_area_coverage_area
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.area_coverage[?(!@.area)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_area_coverage_tested_bool
    when: "facts.tmpl_has_area_coverage_tested"
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.area_coverage[*].tested", op: "in", value: [true, false]}
    on_fail: changes_requested
    reason_code: structure
  - id: tmpl_layers_run
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.layers[?(!@.run)]~", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_layers_source
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.layers[?(!@.source)]~", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_layers_needs_services_bool
    when: "facts.tmpl_has_layers_needs_services"
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.layers.*.needs_services", op: "in", value: [true, false]}
    on_fail: changes_requested
    reason_code: structure
  - id: tmpl_layers_keys
    description: "Entries use the template's keys (a service may omit one it does not have)."
    when: "facts.tmpl_has_layers"
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.layers.keys()", op: "in", value: ["unit", "integration", "e2e"]}
    on_fail: advisory
    reason_code: structure
  - id: tmpl_evidence
    description: "Contract: every entry has confidence; observed needs source, inferred needs basis or note."
    run: builtin:evidence_entries
    args: {artifact: note, lists: ["tests", "area_coverage"]}
    on_fail: changes_requested
    reason_code: unsupported_claim
  # <<< GENERATED
  - id: right_service
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.service", op: "==", value: "{item.id}"}
    on_fail: changes_requested
    reason_code: scope
  - id: pack_matches_stack
    description: Downstream skills trust stack-detect's verdict; they must not re-detect.
    run: builtin:fact_compare
    args: {left: facts.note_pack, right: facts.stack_pack, op: "=="}
    on_fail: changes_requested
    reason_code: wrong_assumption
  - id: bare_areas_explained
    description: An area marked not tested must say what was checked (its note), not just tested false.
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.area_coverage[?(@.tested == false)][?(!@.note)]", op: empty}
    on_fail: changes_requested
    reason_code: unsupported_claim
  - id: covered_areas_cite_tests
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.area_coverage[?(@.tested == true)][?(!@.by)]", op: empty}
    on_fail: changes_requested
    reason_code: unsupported_claim
  - id: sources_resolve
    run: builtin:sources_resolve
    args: {artifact: note, scope: "{item.root}", sample: all}
    on_fail: changes_requested
    reason_code: unsupported_claim
  - id: inference_mode_declared
    when: "facts.inference_mode"
    run: builtin:regex_count
    args: {artifact: note, pattern: '(?i)inference mode', min: 1}
    on_fail: changes_requested
    reason_code: quality
  - id: test_files_counted
    when: "not facts.inference_mode"
    run: builtin:glob_count
    args: {glob: "{item.root}/{pack.locations.tests}/**/*", min: 0}
    on_fail: advisory
    reason_code: coverage_gap
  - id: listed_tests_exist
    run: builtin:paths_exist
    args: {fact: facts.test_paths, base: "{item.root}"}
    on_fail: changes_requested
    reason_code: unsupported_claim

judge:
  tier: low
  vendor: prefer_different
  inputs: [note, facts.observed_sample]
  criteria:
    - id: cited_line_supports_claim
      for_each: facts.observed_sample
      max_items: 12
      question: "Does the cited source line actually support this claim, exactly as stated (not a stronger version of it)? Claim and source: {item}"
      on_fail: changes_requested
      reason_code: unsupported_claim
    - id: coverage_not_overstated
      question: "Is each area's coverage level supported by the listed tests (no area called covered on the strength of a test file name alone)?"
      on_fail: changes_requested
      reason_code: unsupported_claim
