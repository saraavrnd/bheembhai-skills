version: 1
skill: sdlc-discovery-security-posture
summary: >
  security-posture.md covers every area of the template, ranks sourced findings by severity, and accounts for every endpoint the API surfaces mark as having no declared auth.
verdicts_used: [failed_execution, changes_requested]

facts:
  # >>> GENERATED facts (tools/gen_template_checks.py)
  tmpl_has_findings_severity:
    kind: yaml_block
    from: note
    info: "yaml machine"
    expr: "$.findings[*].severity"
  # <<< GENERATED
  service_ids:
    kind: yaml_block
    from: "{layout.services_manifest}"
    info: "yaml bheembhai:foreach"
    expr: "$.services[*].id"
  have_api_surface:
    kind: glob
    pattern: "{layout.discovery_root}*/api-surface.md"
    key: parent_dir
  have_dependency_inventory:
    kind: glob
    pattern: "{layout.discovery_root}*/dependency-inventory.md"
    key: parent_dir
  have_stack:
    kind: glob
    pattern: "{layout.discovery_root}*/stack.md"
    key: parent_dir
  observed_sample:
    kind: yaml_block
    from: note
    info: "yaml machine"
    expr: "$..[?(@.confidence == 'observed')]"
  unauthenticated_paths:
    kind: yaml_block
    from: "{layout.discovery_root}*/api-surface.md"
    expr: "$.endpoints[?(@.auth == 'no auth declared')].path"
  finding_entries:
    kind: yaml_block
    from: note
    info: "yaml machine"
    expr: "$.findings[*]"
  paths_mentioned:
    kind: regex
    from: note
    pattern: '`?(/[A-Za-z0-9_\-/{}:.]*)`?'

preconditions:
  - id: services_manifest_present
    run: builtin:file_exists
    args: {path: "{layout.services_manifest}"}
    on_fail: failed_execution
    reason_code: missing_input
  - id: every_service_has_api_surface
    run: builtin:set_relation
    args: {left: facts.service_ids, right: facts.have_api_surface, relation: subset}
    on_fail: failed_execution
    reason_code: missing_input
  - id: every_service_has_dependency_inventory
    run: builtin:set_relation
    args: {left: facts.service_ids, right: facts.have_dependency_inventory, relation: subset}
    on_fail: failed_execution
    reason_code: missing_input
  - id: every_service_has_stack
    run: builtin:set_relation
    args: {left: facts.service_ids, right: facts.have_stack, relation: subset}
    on_fail: failed_execution
    reason_code: missing_input
  - id: integration_map_present
    run: builtin:file_exists
    args: {path: "{layout.discovery_system_dir}integration-map.md"}
    on_fail: failed_execution
    reason_code: missing_input

artifacts:
  - id: note
    path: "{layout.discovery_system_dir}security-posture.md"

checks:
  - id: own_file_only
    run: builtin:diff_paths
    args: {allowed: ["{layout.discovery_system_dir}security-posture.md"]}
    on_fail: changes_requested
    reason_code: scope
  # >>> GENERATED from templates/security-posture.md.tmpl by tools/gen_template_checks.py: do not edit by hand
  - id: tmpl_block
    description: "The machine block parses and has every top-level key the template declares."
    run: builtin:yaml_block
    args: {artifact: note, info: "yaml machine", required_keys: ["artifact", "findings"], artifact_name: "security-posture"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_sections
    run: builtin:md_sections
    args:
      artifact: note
      ordered: true
      required: ["1. Overview", "2. Authentication & Authorization", "3. Secrets & Configuration", "4. Data Protection", "5. Transport & Network", "6. Input & Attack Surface", "7. Dependency & Supply-Chain", "8. Findings (severity-ranked)", "9. Evidence Notes"]
    on_fail: changes_requested
    reason_code: structure
  - id: tmpl_findings_id
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.findings[?(!@.id)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_findings_claim
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.findings[?(!@.claim)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_findings_severity
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.findings[?(!@.severity)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_findings_severity_enum
    when: "facts.tmpl_has_findings_severity"
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.findings[*].severity", op: "in", value: ["high", "med", "low"]}
    on_fail: changes_requested
    reason_code: structure
  - id: tmpl_evidence
    description: "Contract: every entry has confidence; observed needs source, inferred needs basis or note."
    run: builtin:evidence_entries
    args: {artifact: note, info: "yaml machine", lists: ["findings"]}
    on_fail: changes_requested
    reason_code: unsupported_claim
  # <<< GENERATED
  - id: prose_tagged
    description: Every factual line in the prose carries an observed/inferred/uncertain tag.
    run: builtin:inline_evidence_tags
    args: {artifact: note, exempt_sections: ["1. Overview", "Evidence Notes"]}
    on_fail: changes_requested
    reason_code: unsupported_claim
  - id: confidence_summary_true
    run: builtin:confidence_summary_matches
    args: {artifact: note, info: "yaml machine"}
    on_fail: changes_requested
    reason_code: unsupported_claim
  - id: sources_resolve
    run: builtin:sources_resolve
    args: {artifact: note, info: "yaml machine", sample: 40, follow_artifacts: true, quote: true}
    on_fail: changes_requested
    reason_code: unsupported_claim
  - id: no_template_residue
    run: builtin:md_no_placeholders
    args: {artifact: note}
    on_fail: changes_requested
    reason_code: placeholder_left
  - id: unauthenticated_endpoints_addressed
    description: Every endpoint with no declared auth is discussed (as a finding or an explicit public-by-design note).
    when: "facts.unauthenticated_paths"
    run: builtin:set_relation
    args: {left: facts.unauthenticated_paths, right: facts.paths_mentioned, relation: subset}
    on_fail: changes_requested
    reason_code: coverage_gap
  - id: no_secret_values_copied
    description: The report may point at a secret's location, never reproduce its value.
    run: builtin:regex_absent
    args: {artifact: note, pattern: '(?i)(api[_-]?key|secret|password|token)\s*[:=]\s*["'']?[A-Za-z0-9_\-]{16,}'}
    on_fail: changes_requested
    reason_code: policy

judge:
  tier: high
  vendor: prefer_different
  inputs: [note, facts.observed_sample]
  criteria:
    - id: cited_evidence_supports_claim
      for_each: facts.observed_sample
      max_items: 15
      question: "Does the cited per-service artifact entry or code line support this claim exactly as stated? Claim and source: {item}"
      on_fail: changes_requested
      reason_code: unsupported_claim
    - id: synthesis_labelled
      question: "Is every judgment or synthesis claim (not directly visible in one source) tagged inferred with its basis stated?"
      on_fail: changes_requested
      reason_code: unsupported_claim
    - id: absence_not_observed
      question: "Is every 'nothing reaches X' or 'no endpoint exposes Y' statement tagged inferred (static analysis cannot prove absence), never observed?"
      on_fail: changes_requested
      reason_code: unsupported_claim
    - id: severity_calibrated
      question: "Is each finding's severity consistent with its exploitability and impact as evidenced (no critical without a reachable path, no low for an unauthenticated write)?"
      on_fail: changes_requested
      reason_code: quality
