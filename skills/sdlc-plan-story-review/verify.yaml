version: 1
skill: sdlc-plan-story-review
summary: >
  Review only (ADR-035): the report in the story folder records each gap with severity, evidence,
  question and proposed change; nothing but the report changes and nothing is written to Jira;
  Blocking findings route to stories-write (revise); an architecture conflict escalates.
verdicts_used: [failed_execution, changes_requested, escalation_required]

facts:
  arch_conflict:
    kind: regex
    from: log
    section: "Architecture impact"
    pattern: '(?i)\b(sdlc-arch-design|amend|architecture conflict)\b'
  blocking_findings:
    kind: regex
    from: log
    section: Findings
    pattern: '(?im)^\s*-\s*\**Severity:?\**\s*:?\s*Blocking\b'

preconditions:
  - id: stories_present
    run: builtin:file_exists
    args: {path: "{layout.epic_dir}stories.md"}
    on_fail: failed_execution
    reason_code: missing_input

artifacts:
  - id: log
    path: "{layout.story_dir}story-review.md"
  - id: stories_md
    path: "{layout.epic_dir}stories.md"
    must_change: false
    description: Read as judge input only; a reviewer never changes it.

checks:
  - id: log_sections
    run: builtin:md_sections
    args: {artifact: log, required: [["Context loaded", "Loaded"], ["Findings", "Gaps"], ["Open questions", "Questions"], ["Proposed changes"]], match: contains}
    on_fail: changes_requested
    reason_code: structure
  - id: blocking_routes_to_revise
    description: Blocking findings mean stories-write (revise) must apply them before design.
    when: "self_verdict == 'completed'"
    run: builtin:count_range
    args: {fact: facts.blocking_findings, max: 0}
    on_fail: changes_requested
    reason_code: report_inconsistent
  - id: no_tracker_writes
    description: Read-only reviewer — Jira writes belong to sdlc-tracker-sync.
    run: builtin:trace_tool_absent
    args: {tool: '(?i)(create|edit|update|transition|delete).*(issue|jira)|createJiraIssue|editJiraIssue|transitionJiraIssue'}
    on_fail: changes_requested
    reason_code: policy
  - id: report_only
    description: Reviewer writes only its own report (ADR-035).
    run: builtin:diff_paths
    args: {allowed: ["{layout.story_dir}story-review.md"]}
    on_fail: changes_requested
    reason_code: scope
  - id: escalation_reported
    when: "facts.arch_conflict"
    run: builtin:self_verdict_consistent
    args: {fact: facts.arch_conflict, map: {"*": escalation_required}}
    on_fail: escalation_required
    reason_code: architecture_conflict

judge:
  tier: medium
  vendor: prefer_different
  inputs: [log, stories_md, context.story, "{layout.data_model}"]
  criteria:
    - id: grounded_questions
      question: "Does every question in the log point at something concrete in architecture.md, data-model.md, contracts or a sibling story that does not line up?"
      on_fail: changes_requested
      reason_code: quality
    - id: proposals_target_this_story
      question: "Does every proposed change apply to the target story only (a sibling-story problem is named, not proposed as an edit here)?"
      on_fail: changes_requested
      reason_code: scope
    - id: proposed_ac_executable
      question: "Is every proposed acceptance criterion executable as a test with no further interpretation (concrete values, messages, thresholds)?"
      on_fail: changes_requested
      reason_code: quality
