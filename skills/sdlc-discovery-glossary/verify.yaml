version: 1
skill: sdlc-discovery-glossary
summary: >
  glossary.md defines the domain nouns the code actually uses, each sourced, without duplicates, and covers the entities the data models declare.
verdicts_used: [failed_execution, changes_requested]

facts:
  # >>> GENERATED facts (tools/gen_template_checks.py)
  tmpl_has_terms_kind:
    kind: yaml_block
    from: note
    info: "yaml machine"
    expr: "$.terms[*].kind"
  # <<< GENERATED
  service_ids:
    kind: yaml_block
    from: "{layout.services_manifest}"
    info: "yaml bheembhai:foreach"
    expr: "$.services[*].id"
  have_data_model:
    kind: glob
    pattern: "{layout.discovery_root}*/data-model.md"
    key: parent_dir
  have_structure_map:
    kind: glob
    pattern: "{layout.discovery_root}*/structure-map.md"
    key: parent_dir
  have_api_surface:
    kind: glob
    pattern: "{layout.discovery_root}*/api-surface.md"
    key: parent_dir
  observed_sample:
    kind: yaml_block
    from: note
    info: "yaml machine"
    expr: "$..[?(@.confidence == 'observed')]"
  term_names:
    kind: yaml_block
    from: note
    info: "yaml machine"
    expr: "$.terms[*].term"
  term_entries:
    kind: yaml_block
    from: note
    info: "yaml machine"
    expr: "$.terms[*]"
  entity_names:
    kind: yaml_block
    from: "{layout.discovery_root}*/data-model.md"
    expr: "$.entities[*].name"

preconditions:
  - id: services_manifest_present
    run: builtin:file_exists
    args: {path: "{layout.services_manifest}"}
    on_fail: failed_execution
    reason_code: missing_input
  - id: every_service_has_data_model
    run: builtin:set_relation
    args: {left: facts.service_ids, right: facts.have_data_model, relation: subset}
    on_fail: failed_execution
    reason_code: missing_input
  - id: every_service_has_structure_map
    run: builtin:set_relation
    args: {left: facts.service_ids, right: facts.have_structure_map, relation: subset}
    on_fail: failed_execution
    reason_code: missing_input
  - id: every_service_has_api_surface
    run: builtin:set_relation
    args: {left: facts.service_ids, right: facts.have_api_surface, relation: subset}
    on_fail: failed_execution
    reason_code: missing_input

artifacts:
  - id: note
    path: "{layout.discovery_system_dir}glossary.md"

checks:
  - id: own_file_only
    run: builtin:diff_paths
    args: {allowed: ["{layout.discovery_system_dir}glossary.md"]}
    on_fail: changes_requested
    reason_code: scope
  # >>> GENERATED from templates/glossary.md.tmpl by tools/gen_template_checks.py: do not edit by hand
  - id: tmpl_block
    description: "The machine block parses and has every top-level key the template declares."
    run: builtin:yaml_block
    args: {artifact: note, info: "yaml machine", required_keys: ["artifact", "terms"], artifact_name: "glossary"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_sections
    run: builtin:md_sections
    args:
      artifact: note
      ordered: true
      required: ["1. Overview", "2. Domain Terms", "3. Abbreviations & Acronyms", "4. Evidence Notes"]
    on_fail: changes_requested
    reason_code: structure
  - id: tmpl_terms_term
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.terms[?(!@.term)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_terms_definition
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.terms[?(!@.definition)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_terms_kind
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.terms[?(!@.kind)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_terms_kind_enum
    when: "facts.tmpl_has_terms_kind"
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.terms[*].kind", op: "in", value: ["term", "abbreviation"]}
    on_fail: changes_requested
    reason_code: structure
  - id: tmpl_evidence
    description: "Contract: every entry has confidence; observed needs source, inferred needs basis or note."
    run: builtin:evidence_entries
    args: {artifact: note, info: "yaml machine", lists: ["terms"]}
    on_fail: changes_requested
    reason_code: unsupported_claim
  # <<< GENERATED
  - id: prose_tagged
    description: Every factual line in the prose carries an observed/inferred/uncertain tag.
    run: builtin:inline_evidence_tags
    args: {artifact: note, exempt_sections: ["1. Overview", "Evidence Notes"]}
    on_fail: changes_requested
    reason_code: unsupported_claim
  - id: confidence_summary_true
    run: builtin:confidence_summary_matches
    args: {artifact: note, info: "yaml machine"}
    on_fail: changes_requested
    reason_code: unsupported_claim
  - id: sources_resolve
    run: builtin:sources_resolve
    args: {artifact: note, info: "yaml machine", sample: 40, follow_artifacts: true, quote: true}
    on_fail: changes_requested
    reason_code: unsupported_claim
  - id: no_template_residue
    run: builtin:md_no_placeholders
    args: {artifact: note}
    on_fail: changes_requested
    reason_code: placeholder_left
  - id: terms_unique
    run: builtin:unique_values
    args: {fact: facts.term_names}
    on_fail: changes_requested
    reason_code: duplicate
  - id: entities_defined
    run: builtin:set_relation
    args: {left: facts.entity_names, right: facts.term_names, relation: subset}
    on_fail: advisory
    reason_code: coverage_gap

judge:
  tier: medium
  vendor: prefer_different
  inputs: [note, facts.observed_sample]
  criteria:
    - id: cited_evidence_supports_claim
      for_each: facts.observed_sample
      max_items: 15
      question: "Does the cited per-service artifact entry or code line support this claim exactly as stated? Claim and source: {item}"
      on_fail: changes_requested
      reason_code: unsupported_claim
    - id: synthesis_labelled
      question: "Is every judgment or synthesis claim (not directly visible in one source) tagged inferred with its basis stated?"
      on_fail: changes_requested
      reason_code: unsupported_claim
    - id: definitions_from_code
      question: "Is each definition grounded in how the code uses the term (model, route, module), not a dictionary or industry definition the code does not support?"
      on_fail: changes_requested
      reason_code: unsupported_claim
