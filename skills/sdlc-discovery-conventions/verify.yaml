version: 1
skill: sdlc-discovery-conventions
summary: >
  conventions.md states each convention with sampled, sourced examples, marks generalizations as inferred, and records the exceptions it saw.
verdicts_used: [failed_execution, changes_requested]

facts:
  # >>> GENERATED facts (tools/gen_template_checks.py)
  tmpl_has_conventions_area:
    kind: yaml_block
    from: note
    info: "yaml machine"
    expr: "$.conventions[*].area"
  # <<< GENERATED
  service_ids:
    kind: yaml_block
    from: "{layout.services_manifest}"
    info: "yaml bheembhai:foreach"
    expr: "$.services[*].id"
  have_structure_map:
    kind: glob
    pattern: "{layout.discovery_root}*/structure-map.md"
    key: parent_dir
  have_api_surface:
    kind: glob
    pattern: "{layout.discovery_root}*/api-surface.md"
    key: parent_dir
  observed_sample:
    kind: yaml_block
    from: note
    info: "yaml machine"
    expr: "$..[?(@.confidence == 'observed')]"
  convention_entries:
    kind: yaml_block
    from: note
    info: "yaml machine"
    expr: "$.conventions[*]"

preconditions:
  - id: services_manifest_present
    run: builtin:file_exists
    args: {path: "{layout.services_manifest}"}
    on_fail: failed_execution
    reason_code: missing_input
  - id: every_service_has_structure_map
    run: builtin:set_relation
    args: {left: facts.service_ids, right: facts.have_structure_map, relation: subset}
    on_fail: failed_execution
    reason_code: missing_input
  - id: every_service_has_api_surface
    run: builtin:set_relation
    args: {left: facts.service_ids, right: facts.have_api_surface, relation: subset}
    on_fail: failed_execution
    reason_code: missing_input

artifacts:
  - id: note
    path: "{layout.discovery_system_dir}conventions.md"

checks:
  - id: own_file_only
    run: builtin:diff_paths
    args: {allowed: ["{layout.discovery_system_dir}conventions.md"]}
    on_fail: changes_requested
    reason_code: scope
  # >>> GENERATED from templates/conventions.md.tmpl by tools/gen_template_checks.py: do not edit by hand
  - id: tmpl_block
    description: "The machine block parses and has every top-level key the template declares."
    run: builtin:yaml_block
    args: {artifact: note, info: "yaml machine", required_keys: ["artifact", "conventions"], artifact_name: "conventions"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_sections
    run: builtin:md_sections
    args:
      artifact: note
      ordered: true
      required: ["1. Overview", "2. Code Organization", "3. Naming", "4. Error Handling & Logging", "5. Testing Conventions", "6. API / Interface Conventions", "7. Configuration & Environment", "8. Evidence Notes"]
    on_fail: changes_requested
    reason_code: structure
  - id: tmpl_conventions_area
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.conventions[?(!@.area)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_conventions_claim
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.conventions[?(!@.claim)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_conventions_area_enum
    when: "facts.tmpl_has_conventions_area"
    run: builtin:jsonpath_assert
    args: {artifact: note, info: "yaml machine", expr: "$.conventions[*].area", op: "in", value: ["organization", "naming", "errors", "testing", "api", "config"]}
    on_fail: changes_requested
    reason_code: structure
  - id: tmpl_evidence
    description: "Contract: every entry has confidence; observed needs source, inferred needs basis or note."
    run: builtin:evidence_entries
    args: {artifact: note, info: "yaml machine", lists: ["conventions"]}
    on_fail: changes_requested
    reason_code: unsupported_claim
  # <<< GENERATED
  - id: prose_tagged
    description: Every factual line in the prose carries an observed/inferred/uncertain tag.
    run: builtin:inline_evidence_tags
    args: {artifact: note, exempt_sections: ["1. Overview", "Evidence Notes"]}
    on_fail: changes_requested
    reason_code: unsupported_claim
  - id: confidence_summary_true
    run: builtin:confidence_summary_matches
    args: {artifact: note, info: "yaml machine"}
    on_fail: changes_requested
    reason_code: unsupported_claim
  - id: sources_resolve
    run: builtin:sources_resolve
    args: {artifact: note, info: "yaml machine", sample: 40, follow_artifacts: true, quote: true}
    on_fail: changes_requested
    reason_code: unsupported_claim
  - id: no_template_residue
    run: builtin:md_no_placeholders
    args: {artifact: note}
    on_fail: changes_requested
    reason_code: placeholder_left
  - id: has_conventions
    run: builtin:count_range
    args: {fact: facts.convention_entries, min: 3}
    on_fail: changes_requested
    reason_code: coverage_gap

judge:
  tier: medium
  vendor: prefer_different
  inputs: [note, facts.observed_sample]
  criteria:
    - id: cited_evidence_supports_claim
      for_each: facts.observed_sample
      max_items: 15
      question: "Does the cited per-service artifact entry or code line support this claim exactly as stated? Claim and source: {item}"
      on_fail: changes_requested
      reason_code: unsupported_claim
    - id: synthesis_labelled
      question: "Is every judgment or synthesis claim (not directly visible in one source) tagged inferred with its basis stated?"
      on_fail: changes_requested
      reason_code: unsupported_claim
    - id: generalization_supported
      question: "Is every convention stated as a rule supported by at least two sampled files, with a single-example pattern tagged inferred or uncertain?"
      on_fail: changes_requested
      reason_code: unsupported_claim
