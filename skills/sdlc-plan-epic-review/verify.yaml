version: 1
skill: sdlc-plan-epic-review
summary: >
  Review only (ADR-035): the report records the full story set and each cross-story gap with its
  severity, evidence, question and proposed change; nothing but the report changes, nothing is
  written to Jira; Blocking findings route to stories-write (revise); an architecture conflict
  escalates.
verdicts_used: [failed_execution, changes_requested, escalation_required]

facts:
  arch_conflict:
    kind: regex
    from: log
    section: "Architecture impact"
    pattern: '(?i)\b(sdlc-arch-design|amend|architecture conflict)\b'
  blocking_findings:
    kind: regex
    from: log
    section: Findings
    pattern: '(?im)^\s*-\s*\**Severity:?\**\s*:?\s*Blocking\b'

preconditions:
  - id: stories_present
    run: builtin:file_exists
    args: {path: "{layout.epic_dir}stories.md"}
    on_fail: failed_execution
    reason_code: missing_input
  - id: story_map_present
    run: builtin:file_exists
    args: {path: "{layout.epic_dir}story-map.json"}
    on_fail: failed_execution
    reason_code: missing_input

artifacts:
  - id: log
    path: "{layout.epic_dir}epic-review.md"
  - id: stories_md
    path: "{layout.epic_dir}stories.md"
    must_change: false
    description: Read as judge input only; a reviewer never changes it.

checks:
  - id: log_sections
    run: builtin:md_sections
    args: {artifact: log, required: [["Context loaded", "Loaded"], ["Findings", "Gaps"], ["Open questions", "Questions"], ["Proposed changes"]], match: contains}
    on_fail: changes_requested
    reason_code: structure
  - id: blocking_routes_to_revise
    description: Blocking findings mean stories-write (revise) must apply them before sequencing.
    when: "self_verdict == 'completed'"
    run: builtin:count_range
    args: {fact: facts.blocking_findings, max: 0}
    on_fail: changes_requested
    reason_code: report_inconsistent
  - id: no_tracker_writes
    description: Read-only reviewer — Jira writes belong to sdlc-tracker-sync.
    run: builtin:trace_tool_absent
    args: {tool: '(?i)(create|edit|update|transition|delete).*(issue|jira)|createJiraIssue|editJiraIssue|transitionJiraIssue'}
    on_fail: changes_requested
    reason_code: policy
  - id: escalation_reported
    when: "facts.arch_conflict"
    run: builtin:self_verdict_consistent
    args: {fact: facts.arch_conflict, map: {"*": escalation_required}}
    on_fail: escalation_required
    reason_code: architecture_conflict
  - id: report_only
    description: Reviewer writes only its own report (ADR-035).
    run: builtin:diff_paths
    args: {allowed: ["{layout.epic_dir}epic-review.md"]}
    on_fail: changes_requested
    reason_code: scope

judge:
  tier: high
  vendor: prefer_different
  inputs: [log, stories_md, "{layout.data_model}", "{layout.architecture}"]
  criteria:
    - id: cross_story_only
      question: "Does every gap in the log involve two or more stories, or the epic's own boundary, rather than a single-story concern that belongs to sdlc-plan-story-review?"
      on_fail: changes_requested
      reason_code: scope
    - id: grounded_questions
      question: "Does every question cite the concrete doc, section or sibling story that made it necessary (not a generic 'anything unclear?')?"
      on_fail: changes_requested
      reason_code: quality
    - id: proposals_cover_every_story
      question: "Where one finding affects several stories, does the proposed change name every one of those stories and say the same thing for each?"
      on_fail: changes_requested
      reason_code: quality
