version: 1
skill: sdlc-discovery-structure-map
summary: >
  structure-map.md indexes the service's areas, every observed area resolves to a real path, and deviations from the pack's conventional layout are listed as non_conventional.
verdicts_used: [failed_execution, changes_requested]

facts:
  stack_pack:
    kind: yaml_block
    from: "{layout.discovery_service_dir}stack.md"
    expr: "$.stack_pack"
  note_pack:
    kind: yaml_block
    from: note
    expr: "$.stack_pack"
  inference_mode:
    kind: yaml_block
    from: "{layout.discovery_service_dir}stack.md"
    expr: "$[?(@.stack_pack == 'none')]"
  area_paths:
    kind: yaml_block
    from: note
    expr: "$.areas[*].path"
  observed_sample:
    kind: yaml_block
    from: note
    expr: "$.areas[?(@.confidence == 'observed')]"

preconditions:
  - id: stack_note_present
    run: builtin:file_exists
    args: {path: "{layout.discovery_service_dir}stack.md"}
    on_fail: failed_execution
    reason_code: missing_input

artifacts:
  - id: note
    path: "{layout.discovery_service_dir}structure-map.md"

checks:
  - id: own_service_only
    description: >
      A fan-out child writes only under its own service folder (a child that wrote all services'
      notes made every push-rebase conflict, live 2026-10-17).
    run: builtin:diff_paths
    args: {allowed: ["{layout.discovery_service_dir}**"]}
    on_fail: changes_requested
    reason_code: scope
  # >>> GENERATED from templates/structure-map.md.tmpl by tools/gen_template_checks.py: do not edit by hand
  - id: tmpl_block
    description: "The machine block parses and has every top-level key the template declares."
    run: builtin:yaml_block
    args: {artifact: note, required_keys: ["artifact", "service", "generated", "stack_pack", "summary", "areas", "non_conventional"], artifact_name: "structure-map"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_areas_area
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.areas[?(!@.area)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_areas_path
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.areas[?(!@.path)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_areas_purpose
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.areas[?(!@.purpose)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_non_conventional_path
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.non_conventional[?(!@.path)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_non_conventional_purpose
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.non_conventional[?(!@.purpose)]", op: "empty"}
    on_fail: changes_requested
    reason_code: schema_invalid
  - id: tmpl_evidence
    description: "Contract: every entry has confidence; observed needs source, inferred needs basis or note."
    run: builtin:evidence_entries
    args: {artifact: note, lists: ["areas", "non_conventional"]}
    on_fail: changes_requested
    reason_code: unsupported_claim
  # <<< GENERATED
  - id: right_service
    run: builtin:jsonpath_assert
    args: {artifact: note, expr: "$.service", op: "==", value: "{item.id}"}
    on_fail: changes_requested
    reason_code: scope
  - id: pack_matches_stack
    description: Downstream skills trust stack-detect's verdict; they must not re-detect.
    run: builtin:fact_compare
    args: {left: facts.note_pack, right: facts.stack_pack, op: "=="}
    on_fail: changes_requested
    reason_code: wrong_assumption
  - id: sources_resolve
    run: builtin:sources_resolve
    args: {artifact: note, scope: "{item.root}", sample: all}
    on_fail: changes_requested
    reason_code: unsupported_claim
  - id: inference_mode_declared
    when: "facts.inference_mode"
    run: builtin:regex_count
    args: {artifact: note, pattern: '(?i)inference mode', min: 1}
    on_fail: changes_requested
    reason_code: quality
  - id: area_paths_exist
    run: builtin:paths_exist
    args: {fact: facts.area_paths, base: "{item.root}"}
    on_fail: changes_requested
    reason_code: unsupported_claim

judge:
  tier: low
  vendor: prefer_different
  inputs: [note, facts.observed_sample]
  criteria:
    - id: cited_line_supports_claim
      for_each: facts.observed_sample
      max_items: 12
      question: "Does the cited source line actually support this claim, exactly as stated (not a stronger version of it)? Claim and source: {item}"
      on_fail: changes_requested
      reason_code: unsupported_claim
    - id: purposes_plausible
      question: "Is each area's stated purpose consistent with what its path and the stack's conventions imply (no purpose invented beyond the evidence)?"
      on_fail: changes_requested
      reason_code: unsupported_claim
