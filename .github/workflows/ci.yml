# Tier 1 (ADR-032 §2): static checks on every PR and every push to main. No LLM.
# Tier 2 is the platform's own manifest gate (`bheembhai-verify lint`), installed
# from the platform repo's `verify-v<pin>` release assets. That repo is private,
# so tier 2 needs the PLATFORM_REPO_TOKEN secret and runs on pushes and
# same-repo PRs; a fork PR has no secrets and is skipped with a notice instead
# of failing.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Mapped here because `secrets` is not readable in a step `if:`.
      PLATFORM_REPO_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-tools.txt
      - name: Shared notes are in sync
        run: python tools/build.py sync --check
      - name: Static checks
        run: python tools/check.py
      - name: Install the verifier (tier 2)
        if: ${{ env.PLATFORM_REPO_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.PLATFORM_REPO_TOKEN }}
        run: |
          set -euo pipefail
          PIN=$(sed -n 's/^bheembhai-verify==\([0-9.]*\)$/\1/p' requirements-verify.txt)
          test -n "$PIN" || { echo "no bheembhai-verify pin in requirements-verify.txt"; exit 1; }
          mkdir -p "$RUNNER_TEMP/verify-pkg"
          gh release download "verify-v$PIN" -R saraavrnd/bheembhai-mvp \
            -p '*.whl' -p 'SHA256SUMS' -D "$RUNNER_TEMP/verify-pkg"
          cd "$RUNNER_TEMP/verify-pkg"
          WHEEL=$(ls ./*.whl)
          # The checksum line must exist; --ignore-missing only forgives the
          # assets deliberately not downloaded (the sdist).
          grep -qF "$(basename "$WHEEL")" SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing
          pip install "$WHEEL"
          bheembhai-verify --version
      - name: Verifier lint (tier 2)
        if: ${{ env.PLATFORM_REPO_TOKEN != '' }}
        run: bheembhai-verify lint skills/ --require-all
      - name: Tier 2 skipped
        if: ${{ env.PLATFORM_REPO_TOKEN == '' }}
        run: echo "::notice::PLATFORM_REPO_TOKEN is unset (fork PR) — the verifier lint did not run"
      - name: Catalog packs
        run: python tools/build.py pack --version "$(python -c 'import yaml;print(yaml.safe_load(open("catalog.yaml"))["version"])')" --git-sha "$GITHUB_SHA"
